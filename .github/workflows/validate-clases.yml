name: Validate Clases & Actividades

on:
  pull_request:
    paths:
      - '**/clase-*/*.md'
      - '**/clase-*/*.png'
      - '**/clase-*/*.jpg'
      - '**/actividad-*/*.md'
      - '**/actividad-*/*.png'
      - '**/actividad-*/*.jpg'

jobs:
  validate:
    name: Validar formato de clases
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get changed files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/clase-*/*.md
            **/clase-*/*.png
            **/clase-*/*.jpg
            **/clase-*/*.jpeg
            **/clase-*/*.gif
            **/actividad-*/*.md
            **/actividad-*/*.png
            **/actividad-*/*.jpg
            **/actividad-*/*.jpeg
            **/actividad-*/*.gif

      - name: Run validation
        if: steps.changed.outputs.any_changed == 'true'
        run: |
          bash .github/scripts/validate-clases.sh ${{ steps.changed.outputs.all_changed_files }} 2>&1 | tee validation_output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT" || echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Post PR comment
        if: steps.changed.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('validation_output.txt', 'utf8');
            const failed = output.includes('Validacion FALLIDA');
            const status = failed ? 'FAIL' : 'PASS';
            const emoji = failed ? '❌' : '✅';

            const body = `## ${emoji} Validacion de Clases y Actividades

            **Resultado:** \`${status}\`

            <details>
            <summary>Detalle de validacion</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            *Workflow: validate-clases.yml*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = 'Validacion de Clases y Actividades';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Fail if errors
        if: always() && steps.changed.outputs.any_changed == 'true'
        run: |
          if [ -f validation_output.txt ] && grep -q "Validacion FALLIDA" validation_output.txt; then
            exit 1
          fi
